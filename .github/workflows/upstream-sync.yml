name: Upstream sync

on:
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: Upstream branch or commit to merge
        required: true
        default: main
  schedule:
    - cron: "23 13 * * 2"

concurrency:
  group: alleycat-upstream-sync
  cancel-in-progress: false

jobs:
  open-sync-pr:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    outputs:
      branch_sha: ${{ steps.sync.outputs.branch_sha }}
      changed: ${{ steps.sync.outputs.changed }}
      pr_number: ${{ steps.pull_request.outputs.pr_number }}
      upstream_sha: ${{ steps.sync.outputs.upstream_sha }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: main
          fetch-depth: 0
      - name: Merge upstream locally
        id: sync
        env:
          UPSTREAM_REF: ${{ inputs.upstream_ref || 'main' }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/dnakov/alleycat.git
          git fetch --no-tags upstream "$UPSTREAM_REF"
          upstream_sha="$(git rev-parse FETCH_HEAD)"
          printf 'upstream_sha=%s\n' "$upstream_sha" >> "$GITHUB_OUTPUT"

          if git merge-base --is-ancestor "$upstream_sha" HEAD; then
            printf 'changed=false\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git checkout -B automation/upstream-sync
          git merge --no-ff "$upstream_sha" -m "Merge Alleycat upstream ${upstream_sha}"
          printf 'branch_sha=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          printf 'changed=true\n' >> "$GITHUB_OUTPUT"
      - name: Publish the review branch without executing merged code
        if: steps.sync.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          remote_sha="$(git ls-remote --heads origin refs/heads/automation/upstream-sync | awk '{print $1}')"
          if [ -n "$remote_sha" ]; then
            git push --force-with-lease="refs/heads/automation/upstream-sync:${remote_sha}" origin HEAD:refs/heads/automation/upstream-sync
          else
            git push origin HEAD:refs/heads/automation/upstream-sync
          fi
      - name: Open or update the review pull request
        id: pull_request
        if: steps.sync.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_SHA: ${{ steps.sync.outputs.upstream_sha }}
        shell: bash
        run: |
          set -euo pipefail
          body_file="$(mktemp)"
          cat >"$body_file" <<EOF
          ## Upstream sync

          Merges [dnakov/alleycat@$UPSTREAM_SHA](https://github.com/dnakov/alleycat/commit/$UPSTREAM_SHA) into the Remora maintenance fork.

          This pull request is intentionally review-only. The workflow never enables auto-merge. Review fork patches, run locked builds, and reconcile any upstream-equivalent changes before merging.

          A separate read-only job validates this exact merge commit. Normal branch-protection review and required checks still apply. A failed result must be resolved on this branch before merge.

          Policy: [Remora Link maintenance policy](https://github.com/$GITHUB_REPOSITORY/blob/main/crates/remora-link/MAINTENANCE.md).
          EOF
          number="$(gh pr list --state open --head automation/upstream-sync --json number --jq '.[0].number // empty')"
          if [ -n "$number" ]; then
            gh pr edit "$number" --title "Sync Alleycat upstream" --body-file "$body_file"
          else
            url="$(gh pr create \
              --base main \
              --head automation/upstream-sync \
              --title "Sync Alleycat upstream" \
              --body-file "$body_file")"
            number="$(gh pr view "$url" --json number --jq .number)"
          fi
          printf 'pr_number=%s\n' "$number" >> "$GITHUB_OUTPUT"

  validate-sync:
    needs: open-sync-pr
    if: needs.open-sync-pr.outputs.changed == 'true'
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ needs.open-sync-pr.outputs.branch_sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          package-manager-cache: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: 1.97.0
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: upstream-sync-read-only
          save-if: false
      - name: Test the exact merged commit without write authority
        run: |
          cargo fetch --locked
          cargo test --locked --frozen --workspace
          node --test npm/test/*.test.mjs
          node npm/scripts/verify-packages.mjs

  report-validation:
    needs: [open-sync-pr, validate-sync]
    if: always() && needs.open-sync-pr.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Record validation on the review PR without checking out code
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH_SHA: ${{ needs.open-sync-pr.outputs.branch_sha }}
          PR_NUMBER: ${{ needs.open-sync-pr.outputs.pr_number }}
          UPSTREAM_SHA: ${{ needs.open-sync-pr.outputs.upstream_sha }}
          VALIDATION_RESULT: ${{ needs.validate-sync.result }}
        shell: bash
        run: |
          set -euo pipefail
          current_head="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq .headRefOid)"
          if [ "$current_head" = "$BRANCH_SHA" ]; then
            reported_result="$VALIDATION_RESULT"
          else
            reported_result="stale (validated $BRANCH_SHA; current head is $current_head)"
          fi
          body_file="$(mktemp)"
          cat >"$body_file" <<EOF
          ## Upstream sync

          Merges [dnakov/alleycat@$UPSTREAM_SHA](https://github.com/dnakov/alleycat/commit/$UPSTREAM_SHA) into the Remora maintenance fork.

          This pull request is intentionally review-only. The workflow never enables auto-merge. Review fork patches and reconcile any upstream-equivalent changes before merging.

          Validated merge commit: [$BRANCH_SHA](https://github.com/$GITHUB_REPOSITORY/commit/$BRANCH_SHA).

          Exact-merge locked validation result: **$reported_result**. Normal branch-protection review and required checks still apply. A non-success or stale result must be resolved on this branch before merge.

          Policy: [Remora Link maintenance policy](https://github.com/$GITHUB_REPOSITORY/blob/main/crates/remora-link/MAINTENANCE.md).
          EOF
          gh pr edit "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --title "Sync Alleycat upstream" --body-file "$body_file"
          if [ "$VALIDATION_RESULT" != "success" ] || [ "$current_head" != "$BRANCH_SHA" ]; then
            echo "the review PR is not at a current, successfully validated merge commit" >&2
            exit 1
          fi
